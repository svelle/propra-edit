name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: cargo test
        run: |
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html
          cargo test --manifest-path src-tauri/Cargo.toml

  golden:
    # Parses every file of the public propra-inf repo. Upstream content changes can
    # break this, so it never blocks the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git clone --depth 1 https://github.com/fubinf/propra-inf ../propra-inf
      - run: npm test
        env:
          PROPRA_INF_DIR: ${{ github.workspace }}/../propra-inf

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: scripts/languagetool/pom.xml
      - run: npm ci
      - run: npm test
      - name: Fetch LanguageTool and build the trimmed JRE
        if: runner.os != 'Windows'
        run: ./scripts/fetch-runtime.sh
      - name: Fetch LanguageTool and build the trimmed JRE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1
      - run: npm run build
      - name: Smoke test LanguageTool with the bundled runtime
        shell: bash
        env:
          PROPRA_LT_LIB: ${{ github.workspace }}/src-tauri/resources/languagetool/lib
          PROPRA_LT_JAVA: ${{ github.workspace }}/src-tauri/resources/jre/bin/java${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml real_server_check -- --nocapture
      - run: npx tauri build
      - name: cargo test (native paths on this platform)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: propra-editor-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
