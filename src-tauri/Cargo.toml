[package]
name = "propra-editor"
version = "0.1.0"
description = "Lean editor for sedrila/ProPra task files"
edition = "2021"
rust-version = "1.80"

[lib]
name = "propra_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34"
notify = "=8.0.0"
ureq = { version = "=2.12.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
